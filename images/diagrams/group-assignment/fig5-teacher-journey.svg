<polyline points="964.075,461 964.075,581" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="964.075,617 964.075,737" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="964.075,773 964.075,893" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
<polyline points="964.075,929 964.075,1049" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#arrowhead)" />
