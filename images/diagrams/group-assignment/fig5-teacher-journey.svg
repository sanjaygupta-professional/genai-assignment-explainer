<rect x="665.6500000000001" y="581" width="596.85" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="640.625" y="737" width="646.9000000000001" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="629.9000000000001" y="893" width="668.35" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="690.675" y="1049" width="546.8000000000001" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="662.075" y="1205" width="604" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<rect x="665.6500000000001" y="1361" width="596.85" height="36" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="313.95000000000005" y="114" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Traditional IEP Process\n8 hours per student&quot;</text>
<text x="313.95" y="1552" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;IEP Architect Process\n1.3 hours per student\n84% time reduction&quot;</text>
<text x="964.075" y="287" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 1: Login\nAuthenticate via school credentials&quot;</text>
<text x="964.075" y="443" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 2: Select Student\nChoose from enrolled students\nor create new profile&quot;</text>
<text x="964.075" y="599" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 3: Enter Details\nDisability type, grade level\ncurrent abilities, goals&quot;</text>
<text x="964.075" y="755" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 4: Query System\nAsk for IEP recommendations\ngoals, accommodations, strategies&quot;</text>
<text x="964.075" y="911" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 5: Review AI Response\nRead generated IEP sections\ncheck citations and compliance&quot;</text>
<text x="964.075" y="1067" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 6: Edit and Refine\nModify suggestions\nadd personal observations&quot;</text>
<text x="964.075" y="1223" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 7: Verify Compliance\nRPWD Act alignment check\nNEP 2020 standards review&quot;</text>
<text x="964.075" y="1379" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Step 8: Export Document\nDownload as PDF or DOCX\nShare with parents and team&quot;</text>
</svg>